name: CI
on:
  push:
    branches: [main, security/production-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-analytics-saas
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-analytics-saas/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript, lint, tests and production build
        run: npm run check
        env:
          AUTH_SECRET: ci-only-secret
          AUTH_URL: http://localhost:3000
          MONGODB_DATABASE: ci_analytics
          MONGODB_URI: mongodb://127.0.0.1:27017/ci_analytics
          CONNECTION_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          OUTBOUND_DB_ALLOWED_HOSTS: localhost
          NEXT_PUBLIC_APP_URL: http://localhost:3000
